<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>On group with an empty filtered child</title>

    <filter id="filter1">
        <feFlood flood-color="green" flood-opacity="0.5"/>
    </filter>
    <filter id="filter2" filterUnits="userSpaceOnUse" x="150" y="20" width="30" height="30">
        <feFlood flood-color="blue"/>
    </filter>
    <g id="g1" filter="url(#filter1)">
        <rect id="rect1" x="100" y="100" width="80" height="80" fill="blue"/>
        <g id="g2" filter="url(#filter2)"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
