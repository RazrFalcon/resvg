<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Semi-transparent displacement map</title>
    <desc>
        The map must be read with non-premultiplied color values,
        so a half-transparent red map displaces exactly like an opaque one.
        The green rect should match the dashed blue outline.
    </desc>

    <filter id="filter1" x="-0.5" y="-0.5" width="2" height="2">
        <feFlood flood-color="red" flood-opacity="0.5" result="map"/>
        <feDisplacementMap in="SourceGraphic" in2="map" scale="40"
                           xChannelSelector="R" yChannelSelector="G"/>
    </filter>
    <rect id="rect1" x="50" y="50" width="100" height="100" fill="green"
          filter="url(#filter1)"/>
    <rect id="expected" x="30" y="70" width="100" height="100" fill="none"
          stroke="blue" stroke-dasharray="4"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
