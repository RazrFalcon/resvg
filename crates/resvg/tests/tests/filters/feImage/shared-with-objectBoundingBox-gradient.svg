<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Shared filter with an `objectBoundingBox` gradient</title>

    <linearGradient id="lg1">
        <stop offset="0" stop-color="green"/>
        <stop offset="1" stop-color="blue"/>
    </linearGradient>
    <defs>
        <rect id="rect1" x="20" y="20" width="160" height="70" fill="url(#lg1)"/>
    </defs>
    <filter id="filter1" filterUnits="userSpaceOnUse" x="0" y="0" width="200" height="200">
        <feImage xlink:href="#rect1"/>
    </filter>
    <rect id="rect2" width="10" height="10" filter="url(#filter1)"/>
    <rect id="rect3" width="10" height="10" filter="url(#filter1)" transform="translate(0 90)"/>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
