<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Nested groups with different clip paths</title>

    <clipPath id="clip1">
        <rect id="rect1" x="40" y="40" width="120" height="120"/>
    </clipPath>
    <clipPath id="clip2">
        <circle id="circle1" cx="140" cy="140" r="50"/>
    </clipPath>
    <g id="g1" clip-path="url(#clip1)">
        <rect id="rect2" x="0" y="0" width="200" height="200" fill="blue"/>
        <g id="g2" clip-path="url(#clip2)">
            <rect id="rect3" x="0" y="0" width="200" height="200" fill="green"/>
        </g>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
