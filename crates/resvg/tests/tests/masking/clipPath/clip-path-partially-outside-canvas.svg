<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Clip path partially outside the canvas</title>

    <clipPath id="clip1">
        <circle id="circle1" cx="10" cy="190" r="80"/>
    </clipPath>
    <g id="g1" clip-path="url(#clip1)">
        <rect id="rect1" x="-100" y="-100" width="400" height="400" fill="green"/>
        <circle id="circle2" cx="40" cy="160" r="30" fill="blue"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
