<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>`clipPathUnits=objectBoundingBox` on a large group</title>

    <clipPath id="clip1" clipPathUnits="objectBoundingBox">
        <rect id="rect1" x="0.4" y="0.35" width="0.25" height="0.3" rx="0.05"/>
    </clipPath>
    <g id="g1" clip-path="url(#clip1)">
        <rect id="rect2" x="-150" y="-150" width="500" height="500" fill="green"/>
        <circle id="circle1" cx="100" cy="100" r="20" fill="blue"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
