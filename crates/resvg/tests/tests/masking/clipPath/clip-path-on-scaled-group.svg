<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
    <title>Scaled clip path on a scaled and translated group</title>

    <clipPath id="clip1" transform="translate(5.5 3.25) scale(1.5 0.75)">
        <rect id="rect1" x="10" y="20" width="30" height="40"/>
    </clipPath>
    <g id="g1" clip-path="url(#clip1)" transform="translate(20.3 30.6) scale(2.1)">
        <rect id="rect2" x="-50" y="-50" width="200" height="200" fill="green"/>
        <circle id="circle1" cx="30" cy="40" r="15" fill="blue"/>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
