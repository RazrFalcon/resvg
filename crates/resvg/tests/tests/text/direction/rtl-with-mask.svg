<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     font-family="Noto Sans" font-size="14">
    <title>`rtl` with `mask`</title>
    <defs>

        <mask id="text">
            <rect width="200" height="200" fill="#555"/>
            <text x="190" y="75" direction="rtl" font-family="Amiri" font-size="36" fill="white">ابجد هوز ABC</text>
        </mask>
        <linearGradient id="lg">
            <stop offset="0" stop-color="white"/>
            <stop offset="1" stop-color="black"/>
        </linearGradient>
        <mask id="gradient" maskContentUnits="objectBoundingBox">
            <rect width="1" height="1" fill="url(#lg)"/>
        </mask>
    </defs>

    <path id="crosshair" d="M 20 100 L 180 100 M 100 20 L 100 180"
          stroke="gray" stroke-width="0.5"/>

    <rect id="rect1" x="10" y="30" width="180" height="60" fill="purple" mask="url(#text)"/>
    <g id="g1" direction="rtl" font-family="Amiri" font-size="24">
        <text id="text1" x="170" y="140" mask="url(#gradient)" fill="blue">ابجد هوز ABC</text>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
