<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     font-family="Noto Sans" font-size="14">
    <title>`rtl` with `text-decoration`</title>

    <path id="crosshair" d="M 20 100 L 180 100 M 100 20 L 100 180"
          stroke="gray" stroke-width="0.5"/>

    <g id="g1" direction="rtl" font-family="Amiri">
        <text id="text1" x="170" y="50" text-decoration="underline">Under ابجد هوز</text>
        <text id="text2" x="170" y="80" text-decoration="line-through">ابجد هوز Line</text>
        <text id="text3" x="170" y="110">Over <tspan text-decoration="overline" fill="red">ابجد هوز</tspan> lined</text>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
