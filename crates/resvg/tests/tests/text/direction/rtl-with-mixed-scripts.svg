<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     font-family="Noto Sans" font-size="14">
    <title>`rtl` with mixed scripts</title>

    <path id="crosshair" d="M 20 100 L 180 100 M 100 20 L 100 180"
          stroke="gray" stroke-width="0.5"/>

    <g id="g1" direction="rtl" font-family="Amiri">
        <text id="text1" x="170" y="50">ابجد ABC 123 هوز</text>
        <text id="text2" x="170" y="75">ابجد هوز Latin ابجد هوز</text>
    </g>
    <g id="g2" direction="ltr" font-family="Amiri">
        <text id="text3" x="30" y="120">ابجد ABC 123 هوز</text>
        <text id="text4" x="30" y="145">ابجد هوز Latin ابجد هوز</text>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
</svg>
