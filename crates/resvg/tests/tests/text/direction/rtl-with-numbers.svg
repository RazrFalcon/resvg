        <text id="text6" x="190" y="144">التاريخ ١٢/٠٥/٢٠٢٦ م</text>
        <text id="text7" x="190" y="166">الرقم ٣٫١٤ و ١٬٠٠٠</text>
    </g>

    <!-- image frame -->
    <rect id="frame" x="1" y="1" width="198" height="198" fill="none" stroke="black"/>
