<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Linear RGB mask gradient</title>
    <defs id="d" color-interpolation="linearRGB">
        <linearGradient id="g">
            <stop id="s1" stop-color="black"/>
            <stop id="s2" offset="1" stop-color="white"/>
        </linearGradient>
        <mask id="m" color-interpolation="inherit">
            <rect id="mr" width="200" height="200" fill="url(#g)"/>
        </mask>
    </defs>
    <rect id="r" width="200" height="200" fill="red" mask="url(#m)"/>
</svg>
