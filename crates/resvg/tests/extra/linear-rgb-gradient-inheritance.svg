<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Linear RGB gradient inheritance</title>
    <defs id="d" style="color-interpolation:linearRGB">
        <linearGradient id="g" color-interpolation="inherit">
            <stop id="s1" stop-color="black"/>
            <stop id="s2" offset="1" stop-color="white"/>
        </linearGradient>
    </defs>
    <rect id="r" width="200" height="200" fill="url(#g)"/>
</svg>
