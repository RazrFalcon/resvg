<svg id="svg1" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg"
     xmlns:xlink="http://www.w3.org/1999/xlink">
    <title>Linear RGB mask colors alpha</title>
    <mask id="m" color-interpolation="linearRGB">
        <rect id="m1" width="100" height="100" fill="#123456"/>
        <rect id="m2" x="100" width="100" height="100" fill="#80c040" opacity="0.5"/>
        <rect id="m3" y="100" width="100" height="100" fill="red"/>
        <rect id="m4" x="100" y="100" width="100" height="100" fill="white"/>
    </mask>
    <rect id="r" width="200" height="200" fill="red" mask="url(#m)"/>
</svg>
