[package]
name = "usvg"
version = "0.48.1"
keywords = ["svg"]
license.workspace = true
edition = "2024"
rust-version = "1.85.0"
description = "An SVG simplification library."
categories = ["multimedia::images"]
repository = "https://github.com/linebender/resvg"
documentation = "https://docs.rs/usvg/"
readme = "README.md"
exclude = ["tests"]
workspace = "../.."

[[bin]]
name = "usvg"
required-features = ["svgz", "text", "system-fonts", "memmap-fonts", "writer"]

[dependencies]
base64 = { version = "0.23", optional = true } # for embedded images
log = "0.4"
pico-args = { version = "0.5", features = ["eq-separator"] }
strict-num = "0.1.1"
svgtypes = "0.16.1"
tiny-skia-path = "0.12.0"
xmlwriter = { version = "0.1", optional = true }

# parser
data-url = "0.3" # for href parsing
flate2 = { version = "1.1", default-features = false, features = ["rust_backend"], optional = true } # SVGZ decoding
imagesize = "0.15.0" # raster images size detection
kurbo = "0.13.0" # Bezier curves utils
roxmltree = "0.21.1"
simplecss = "0.2"
siphasher = "1.0" # perfect hash implementation

# text
fontdb = { version = "0.24", default-features = false, optional = true }
harfrust = { version = "0.14.0", optional = true }
skrifa = { version = "0.48", optional = true, default-features = false, features = ["std"] }
unicode-bidi = { version = "0.3", optional = true }
unicode-script = { version = "0.5", optional = true }
unicode-vo = { version = "0.1", optional = true }

[dev-dependencies]
once_cell = "1.21"

[features]
default = ["svgz", "text", "system-fonts", "memmap-fonts", "writer"]
# Enables SVGZ decoding
svgz = ["flate2"]
# Enables text-to-path conversion support.
# Adds around 400KiB to your binary.
text = ["fontdb", "harfrust", "skrifa", "unicode-bidi", "unicode-script", "unicode-vo", "writer"]
# Enables system fonts loading.
system-fonts = ["fontdb/fs", "fontdb/fontconfig"]
# Enables font files memmaping for faster loading.
memmap-fonts = ["fontdb/memmap"]
# Enables converting trees back to SVG.
writer = ["xmlwriter", "base64"]
